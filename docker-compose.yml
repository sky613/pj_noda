# Next.js 개발 서버. Supabase 로컬 스택은 `pnpm db:start`(Supabase CLI → Docker)로 별도 실행.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3100:3000"
    env_file:
      - .env.local
    environment:
      SUPABASE_INTERNAL_URL: http://host.docker.internal:54321
      WATCHPACK_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
volumes:
  web_node_modules:
  web_next:
